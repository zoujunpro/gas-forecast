interface:
  display_name: "短期客户预测"
  short_description: "处理客户日用气训练、预测、进度查询以及失败恢复流程"
  default_prompt: "使用 $short-term-customer-forecast 为指定客户发起日用气预测并解释结果。"

dependencies:
  tools:
    - type: "mcp"
      value: "gas-forecast"
      description: "天然气预测 Java MCP 业务工具服务"
      transport: "streamable_http"
      url: "http://127.0.0.1:18083/gas-forecast/mcp"

policy:
  allow_implicit_invocation: true
