schemaVersion: 1
scenario: SHORT_TERM
scenarioName: 短期客户日预测
description: 面向单客户或客户范围的日粒度模型训练和用气量预测。
capabilities:
  - code: SHORT_TERM_TRAINING_START
    name: 发起短期客户训练
    description: 按全部、最近周期或指定日期范围发起日模型训练。
    status: AVAILABLE
    read_only: false
    workflow: training
    intent: {domain: TRAINING, action: START, resource: CUSTOMER_MODEL, scenario: SHORT_TERM}
    scopes: [CUSTOMER, REGION_INDUSTRY]
    required_parameters: [conversationNo]
    optional_parameters: [customerCode, customerName, regionCode, industryCode, bulk, trainMode, trainingPeriods, trainingStartDate, trainingEndDate, forceRetrain]
    defaults: {agentCode: short-term, bulk: false, forceRetrain: false, trainMode: ALL}
    confirmations:
      - condition: bulk == true
        message: 本次将为范围内多个客户创建训练任务，是否继续？
      - condition: forceRetrain == true
        message: 本次将不复用已有成功模型并创建新训练，是否继续？
    tools: [customer_search, region_search, industry_search, training_start, training_status_get, training_result_get]

  - code: SHORT_TERM_TRAINING_STATUS
    name: 查询短期训练进度
    description: 查询指定训练批次的状态和业务步骤。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: TRAINING, action: STATUS, resource: TRAINING_BATCH, scenario: SHORT_TERM}
    scopes: [BATCH]
    required_parameters: [conversationNo]
    optional_parameters: [trainBatchNo]
    tools: [training_status_get]

  - code: SHORT_TERM_TRAINING_RESULT
    name: 查询短期训练结果
    description: 查询训练模型、数据范围和质量指标。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: TRAINING, action: RESULT, resource: TRAINING_BATCH, scenario: SHORT_TERM}
    scopes: [BATCH]
    required_parameters: [conversationNo]
    optional_parameters: [trainBatchNo]
    tools: [training_result_get]

  - code: SHORT_TERM_TRAINING_LATEST
    name: 查询客户最新训练
    description: 按客户查询最新训练记录及状态。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: TRAINING, action: LATEST, resource: CUSTOMER_MODEL, scenario: SHORT_TERM}
    scopes: [CUSTOMER]
    required_parameters: [customerCode]
    tools: [customer_search, training_latest_get]

  - code: SHORT_TERM_TRAINING_HISTORY
    name: 查询客户历史训练
    description: 按客户分页查询历史训练记录。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: TRAINING, action: HISTORY, resource: CUSTOMER_MODEL, scenario: SHORT_TERM}
    scopes: [CUSTOMER]
    required_parameters: [customerCode]
    optional_parameters: [startDate, endDate, status, pageNo, pageSize]
    tools: [customer_search, training_history_get]

  - code: SHORT_TERM_FORECAST_START
    name: 发起短期客户预测
    description: 发起每日用气预测；有模型时直接预测，无模型且允许自动训练时先训练。
    status: AVAILABLE
    read_only: false
    workflow: forecasting
    intent: {domain: FORECAST, action: START, resource: CUSTOMER_FORECAST, scenario: SHORT_TERM}
    scopes: [CUSTOMER, REGION_INDUSTRY]
    required_parameters: [conversationNo]
    optional_parameters: [customerCode, customerName, regionCode, industryCode, bulk, forecastStartDate, forecastEndDate, forecastHorizon, trainingPreference, trainingStartDate, trainingEndDate]
    defaults: {agentCode: short-term, forecastFrequency: DAILY, forecastHorizon: 30, trainingPreference: UNSPECIFIED, autoTrain: false, forceRetrain: false, bulk: false, trainMode: ALL}
    confirmations:
      - condition: bulk == true
        message: 本次将为范围内多个客户创建预测任务，是否继续？
      - condition: trainingPreference == FORCE_RETRAIN
        message: 本次将重新训练模型后再预测，是否继续？
    tools: [customer_search, region_search, industry_search, forecast_start, training_status_get, forecast_status_get, forecast_result_get]
    notes: [Java负责判断是否存在可用模型，智能体不预查模型表。]

  - code: SHORT_TERM_FORECAST_STATUS
    name: 查询短期预测进度
    description: 查询指定预测批次的状态和已保存预测点数。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: FORECAST, action: STATUS, resource: FORECAST_BATCH, scenario: SHORT_TERM}
    scopes: [BATCH]
    required_parameters: [conversationNo]
    optional_parameters: [forecastBatchNo]
    tools: [forecast_status_get]

  - code: SHORT_TERM_FORECAST_RESULT
    name: 查询短期预测结果
    description: 查询指定预测批次记录和逐日预测值。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: FORECAST, action: RESULT, resource: FORECAST_BATCH, scenario: SHORT_TERM}
    scopes: [BATCH]
    required_parameters: [conversationNo]
    optional_parameters: [forecastBatchNo, includePoints]
    defaults: {includePoints: true}
    tools: [forecast_result_get]

  - code: SHORT_TERM_FORECAST_LATEST
    name: 查询客户最新短期预测
    description: 按客户查询最新一次短期日预测记录和结果。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: FORECAST, action: LATEST, resource: CUSTOMER_FORECAST, scenario: SHORT_TERM}
    scopes: [CUSTOMER]
    required_parameters: [customerCode]
    optional_parameters: [includePoints]
    tools: [customer_search, forecast_latest_get]

  - code: SHORT_TERM_FORECAST_HISTORY
    name: 查询客户历史短期预测
    description: 按客户和时间范围分页查询短期预测记录。
    status: AVAILABLE
    read_only: true
    workflow: query
    intent: {domain: FORECAST, action: HISTORY, resource: CUSTOMER_FORECAST, scenario: SHORT_TERM}
    scopes: [CUSTOMER]
    required_parameters: [customerCode]
    optional_parameters: [startDate, endDate, status, pageNo, pageSize]
    tools: [customer_search, forecast_history_get]
