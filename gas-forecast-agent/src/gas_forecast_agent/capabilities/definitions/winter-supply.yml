schemaVersion: 1
scenario: WINTER_SUPPLY
scenarioName: 冬季保供
description: 冬季需求、峰值和供需风险分析；业务口径尚需进一步确认。
capabilities:
  - code: WINTER_SUPPLY_TRAINING_START
    name: 发起冬季保供训练
    description: 为冬季保供预测准备和训练模型。
    status: NEEDS_CONFIRMATION
    read_only: false
    workflow: training
    intent: {domain: TRAINING, action: START, resource: SUPPLY_MODEL, scenario: WINTER_SUPPLY}
    scopes: [REGION]
    required_parameters: [conversationNo]
    defaults: {agentCode: winter-supply}
    tools: [training_start, training_status_get, training_result_get]
    notes: [需要确认是否按地区训练以及历史冬季数据要求。]

  - code: WINTER_SUPPLY_FORECAST_START
    name: 发起冬季保供预测
    description: 发起按旬的冬季需求预测，当前工具默认18旬。
    status: NEEDS_CONFIRMATION
    read_only: false
    workflow: forecasting
    intent: {domain: FORECAST, action: START, resource: SUPPLY_FORECAST, scenario: WINTER_SUPPLY}
    scopes: [REGION]
    required_parameters: [conversationNo, regionCode]
    optional_parameters: [trainingPreference]
    defaults: {agentCode: winter-supply, forecastFrequency: TENDAY, forecastHorizon: 18, trainingPreference: UNSPECIFIED, autoTrain: false}
    tools: [forecast_start, training_status_get, forecast_status_get, forecast_result_get]
    notes: [需要确认供应能力来源、风险等级规则以及正常寒冷极寒情景。]

  - code: WINTER_SUPPLY_RESULT
    name: 查询冬季保供结果
    description: 查询需求预测、峰值、供需缺口和风险等级。
    status: PLANNED
    read_only: true
    workflow: query
    intent: {domain: FORECAST, action: RESULT, resource: SUPPLY_FORECAST, scenario: WINTER_SUPPLY}
    scopes: [REGION, BATCH]
    missing_tools: [winter_supply_result_get]
