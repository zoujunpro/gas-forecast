[project]
name = "gas-forecast-agent"
version = "0.1.0"
description = "Conversation router and AI agents for gas forecasting."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "mcp>=1.20,<2",
    "openai>=2.0,<3",
    "pydantic-settings>=2.6,<3",
    "PyMySQL>=1.1,<2",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
gas-forecast-agent = "gas_forecast_agent.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gas_forecast_agent = ["capabilities/definitions/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
