[project]
name = "gas-forecast-agent"
version = "0.1.0"
description = "Conversation router and AI agents for gas forecasting."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "langgraph>=1.2,<2",
    "mcp>=1.20,<2",
    "openai>=2.0,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
gas-forecast-agent = "gas_forecast_agent.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/gas-forecast-agent/skills/business-data-query" = ["skills/business-data-query/SKILL.md"]
"share/gas-forecast-agent/skills/customer-gas-forecast" = ["skills/customer-gas-forecast/SKILL.md"]
"share/gas-forecast-agent/skills/model-training-management" = ["skills/model-training-management/SKILL.md"]
"share/gas-forecast-agent/skills/forecast-analysis" = ["skills/forecast-analysis/SKILL.md"]
"share/gas-forecast-agent/skills/general-chat" = ["skills/general-chat/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
