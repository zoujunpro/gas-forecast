name: Frontend CI

on:
  pull_request:
    paths:
      - "gas-forecast-web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    paths:
      - "gas-forecast-web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gas-forecast-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gas-forecast-web/package-lock.json
      - run: npm ci
      - run: npm run check
