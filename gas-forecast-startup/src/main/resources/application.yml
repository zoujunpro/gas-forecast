spring:
  application:
    name: gas-forecast
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/gas-forecast}

logging:
  config: classpath:logs/spring-logback.xml

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
