spring:
  application:
    name: gas-forecast
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/gas-forecast}

logging:
  config: classpath:logs/spring-logback.xml

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

gas:
  forecast:
    mcp:
      enabled: ${MCP_ENABLED:true}
      endpoint: ${MCP_ENDPOINT:/mcp}
      tool-catalog: ${MCP_TOOL_CATALOG:classpath:mcp-tools.yml}
