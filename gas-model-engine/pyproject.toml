[project]
name = "gas-model-engine"
version = "0.1.0"
description = "Reusable forecasting algorithms for the gas forecasting platform."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
prophet = ["prophet>=1.1.6"]
dev = ["pytest>=8.0"]
all = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "prophet>=1.1.6",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
