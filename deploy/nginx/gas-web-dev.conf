server {
    listen 18082;
    server_name localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/gas-web-dev.access.log main;
    error_log /var/log/nginx/gas-web-dev.error.log;

    root /home/web/gas-web/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /agent-api/ {
        proxy_pass http://host.docker.internal:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-TraceId $request_id;
        proxy_read_timeout 300s;
    }

    location ~ ^/(auth|dashboard|system|base-region|base-customer|base-industry|data-file-info|data-daily-sales|data-monthly-sales|model-config|model-feature-definition|model-train-config|model-train-feature-data|model-train-execution|agent-strategy-config|auto-train|ai|model-platform|model-forecast-config|model-forecast-execution|model-forecast-record|model-forecast-result|model-forecast-analysis|monthly-results|short-term-results|winter-supply-results|agents|predict|chat|forecast)(/|$) {
        proxy_pass http://host.docker.internal:18081/gas-forecast$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
