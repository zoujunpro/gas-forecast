[project]
name = "gas-model-platform"
version = "0.1.0"
description = "Unified Python model runtime and management platform for gas forecasting."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "optuna>=3.6",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "prophet>=1.1.6",
    "PyYAML>=6.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gas_model_platform = ["resources/winter_supply_data/*.json"]
