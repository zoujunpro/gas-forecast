# gas-model-platform 公共配置，作用类似 Spring Boot application.yml。
profiles:
  # 可由 GAS_MODEL_PROFILE 覆盖。
  # 本机开发默认与 Java local（18083）配套；部署环境通过 GAS_MODEL_PROFILE 覆盖。
  active: local

app:
  name: gas-model-platform
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8090
  reload: false

training:
  # 单个模型平台进程允许同时执行的训练数；按机器 CPU、内存实测调整。
  max_concurrency: 4

# 模型只向 Java 回调真实过程事件；Java 再负责鉴权后的持久化和 SSE 推送。
events:
  callback_url: ""

logging:
  level: INFO
  directory: logs
  console_enabled: true
  file_enabled: true
  # 是否记录 HTTP 入参和出参；敏感字段会自动脱敏。
  request_body_enabled: true
  response_body_enabled: true
  # 超长 JSON 会截断，长数组只保留前若干项并记录总数量。
  body_max_length: 20000
  body_max_items: 20
  # TimedRotatingFileHandler 保留的历史日志天数。
  retention_days: 30
