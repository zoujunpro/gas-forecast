standardOutput: &standardOutput
  type: object
  required: [success, status, message, retryable]
  additionalProperties: false
  properties:
    success: {type: boolean, description: 本次调用是否成功}
    status:
      type: string
      description: 业务状态
      enum: [COMPLETED, EXECUTING, WAITING_TRAINING, NEED_INFORMATION, FAILED]
    errorCode: {type: [string, "null"], description: 失败时的稳定错误码，成功时为null}
    message: {type: string, description: 可展示给用户的结果或具体失败原因}
    retryable: {type: boolean, description: 是否允许调用方自动重试}
    data: {type: object, description: 成功时为业务结果；失败时包含toolName、reason、nextAction和retryable, additionalProperties: true}

tools:
  - name: memory_get
    title: 查询会话记忆
    description: 查询当前用户会话的工作记忆、待确认动作及最近训练预测批次。成功时data包含记忆键值、lastTrainBatchNo和lastForecastBatchNo。
    inputSchema:
      type: object
      required: [conversationNo]
      additionalProperties: false
      properties:
        conversationNo: {type: string, description: 必填，只能查询当前登录用户拥有的会话编号}
    outputSchema: *standardOutput
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}

  - name: memory_update
    title: 更新会话记忆
    description: 更新会话记忆。UPSERT写入values；DELETE删除values中出现的键；CLEAR清空工作记忆。不得修改其他用户会话。
    inputSchema:
      type: object
      required: [conversationNo, operation]
      additionalProperties: false
      properties:
        conversationNo: {type: string, description: 会话编号}
        operation: {type: string, description: 操作类型, enum: [UPSERT, DELETE, CLEAR]}
        values: {type: object, description: 需要写入的键值，或DELETE时需要删除的键, additionalProperties: true}
    outputSchema: *standardOutput
    annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: false}

  - name: customer_search
    title: 查询客户
    description: 查询标准客户及其地区、行业编码。至少提供customerCode或customerName。MULTIPLE时必须让用户从candidates选择，不得猜测。客户存在不代表支持预测。
    inputSchema: &entityInput
      type: object
      additionalProperties: false
      anyOf: [{required: [customerCode]}, {required: [customerName]}]
      properties: &entityProperties
        conversationNo: {type: string, description: 可选会话编号}
        customerCode: {type: string, description: 客户标准编码，或客户查询条件}
        customerName: {type: string, description: 客户名称或名称片段}
        regionCode: {type: string, description: 地区标准编码，或客户查询筛选条件}
        regionName: {type: string, description: 地区名称或名称片段，或客户查询筛选条件}
        industryCode: {type: string, description: 行业标准编码，或客户查询筛选条件}
        industryName: {type: string, description: 行业名称或业务别名，或客户查询筛选条件}
        limit: {type: integer, description: 最大返回数量，默认20, minimum: 1, maximum: 50}
    outputSchema: *standardOutput
    annotations: &readOnly {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}

  - name: region_search
    title: 查询地区
    description: 查询标准地区。至少提供regionCode或regionName。MULTIPLE时让用户选择；NOT_FOUND时请用户修正名称。
    inputSchema:
      type: object
      additionalProperties: false
      anyOf: [{required: [regionCode]}, {required: [regionName]}]
      properties: *entityProperties
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: industry_search
    title: 查询行业
    description: 查询标准行业，支持“城市燃气”等业务别名。至少提供industryCode或industryName；多个匹配时不得自行选择。
    inputSchema:
      type: object
      additionalProperties: false
      anyOf: [{required: [industryCode]}, {required: [industryName]}]
      properties: *entityProperties
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: training_start
    title: 发起模型训练
    description: 单客户需bulk=false并提供客户；批量需bulk=true、地区和/或行业范围及confirmed=true。模型训练配置只提供默认数据范围；用户本次明确提供trainingStartDate和trainingEndDate时，必须优先采用用户时段并按RANGE执行。RECENT需要trainingPeriods；RANGE需要开始和结束日期。成功时data.tasks包含trainBatchNo。超时后先查状态，不得盲目重提。
    inputSchema: &executionInput
      type: object
      required: [conversationNo]
      additionalProperties: false
      allOf: &executionRules
        - if:
            required: [trainMode]
            properties: {trainMode: {const: RECENT}}
          then:
            required: [trainingPeriods]
        - if:
            required: [trainMode]
            properties: {trainMode: {const: RANGE}}
          then:
            required: [trainingStartDate, trainingEndDate]
        - if:
            required: [bulk]
            properties: {bulk: {const: true}}
          then:
            required: [confirmed]
            properties: {confirmed: {const: true}}
            anyOf:
              - required: [regionCode]
              - required: [regionName]
              - required: [industryCode]
              - required: [industryName]
        - if:
            properties: {bulk: {const: false}}
          then:
            anyOf:
              - required: [customerCode]
              - required: [customerName]
      properties: &executionProperties
        conversationNo: {type: string, description: 会话编号}
        agentCode: {type: string, description: 智能体编码，默认short-term, enum: [short-term, monthly-sales, winter-supply]}
        customerCode: {type: string, description: 单客户标准编码}
        customerName: {type: string, description: 客户名称，服务端解析成唯一编码}
        regionCode: {type: string, description: 批量范围的标准地区编码}
        regionName: {type: string, description: 批量范围地区名称，服务端解析成唯一编码}
        industryCode: {type: string, description: 批量范围的标准行业编码}
        industryName: {type: string, description: 批量范围行业名称或别名，服务端解析成唯一编码}
        bulk: {type: boolean, description: 是否批量执行，默认false}
        confirmed: {type: boolean, description: bulk=true时必须为true，表示用户已明确确认}
        trainMode: {type: string, description: 训练数据范围模式, enum: [ALL, RECENT, RANGE]}
        trainingPeriods: {type: integer, description: RECENT模式最近周期数，此模式下必填, minimum: 1, maximum: 10000}
        trainingStartDate: {type: string, format: date, description: 用户指定的训练开始日期；与结束日期同时提供时优先覆盖模型默认训练范围并按RANGE执行}
        trainingEndDate: {type: string, format: date, description: 用户指定的训练结束日期；与开始日期同时提供时优先覆盖模型默认训练范围并按RANGE执行}
        forceRetrain: {type: boolean, description: 是否忽略现有成功模型并强制重新训练}
        idempotencyKey: {type: string, description: 调用方生成的唯一幂等键，同一次网络重试必须复用}
    outputSchema: *standardOutput
    annotations: &mutating {readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: false}

  - name: training_status_get
    title: 查询训练进度
    description: 查询训练状态和执行步骤。优先传trainBatchNo；未传时从conversationNo对应记忆读取lastTrainBatchNo。返回result和steps。
    inputSchema: &trainBatchInput
      type: object
      required: [conversationNo]
      additionalProperties: false
      properties:
        conversationNo: {type: string, description: 会话编号，批次号为空时用于读取最近批次}
        trainBatchNo: {type: string, description: 训练批次号，建议明确传入}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: training_result_get
    title: 查询训练结果
    description: 查询训练模型、训练范围及MAPE、WMAPE、SMAPE、RMSE、MAE、R2等指标。任务未完成时不要编造指标，应继续查询状态。
    inputSchema: *trainBatchInput
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: forecast_start
    title: 发起燃气预测
    description: 单客户需bulk=false并提供客户；批量需bulk=true、范围及confirmed=true。短期客户智能体按日预测，默认30天；月度销量智能体按月预测，默认12个月；冬季保供智能体按旬预测，默认18旬。用户可传开始日期和周期，也可传开始、结束日期；用户时间优先于默认值，但不能超过模型配置的最大预测期数。autoTrain=true时无有效模型会返回WAITING_TRAINING和trainBatchNo。
    inputSchema:
      type: object
      required: [conversationNo]
      additionalProperties: false
      allOf: *executionRules
      properties:
        <<: *executionProperties
        forecastStartDate: {type: string, format: date, description: 用户指定的预测开始日期；未传时默认为客户最新销量日期的下一天}
        forecastEndDate: {type: string, format: date, description: 用户指定的预测结束日期；提供后按开始和结束日期计算周期，并优先于forecastHorizon}
        forecastHorizon: {type: integer, description: 用户指定的预测周期；默认值和最大值由智能体及模型配置决定, minimum: 1, maximum: 366}
        forecastFrequency: {type: string, description: 预测时间粒度；short-term只能DAILY，monthly-sales只能MONTHLY，winter-supply只能TENDAY, enum: [DAILY, TENDAY, MONTHLY]}
        autoTrain: {type: boolean, description: 没有有效模型时是否自动训练，默认true}
    outputSchema: *standardOutput
    annotations: *mutating

  - name: forecast_status_get
    title: 查询预测进度
    description: 查询预测状态和已保存点数。优先传forecastBatchNo；未传时读取会话最近预测批次。WAITING_TRAINING且无forecastBatchNo时应改查trainBatchNo。
    inputSchema: &forecastBatchInput
      type: object
      required: [conversationNo]
      additionalProperties: false
      properties:
        conversationNo: {type: string, description: 会话编号，批次号为空时用于读取最近批次}
        forecastBatchNo: {type: string, description: 预测批次号，建议明确传入}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: forecast_result_get
    title: 查询预测结果
    description: 查询已有预测记录和逐期预测值，不创建任务。includePoints=false只返回记录，true返回points。未成功时先根据status继续等待或处理失败原因。
    inputSchema:
      type: object
      required: [conversationNo]
      additionalProperties: false
      properties:
        conversationNo: {type: string, description: 会话编号，批次号为空时用于读取最近批次}
        forecastBatchNo: {type: string, description: 预测批次号，建议明确传入}
        includePoints: {type: boolean, description: 是否返回逐期预测明细，默认true，数据量大时可设为false}
    outputSchema: *standardOutput
    annotations: *readOnly
