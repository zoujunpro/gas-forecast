standardOutput: &standardOutput
  type: object
  required: [success, status, resultType, message, retryable]
  additionalProperties: false
  properties:
    success: {type: boolean, description: 本次调用是否成功}
    status:
      type: string
      description: 业务状态
      enum: [COMPLETED, EMPTY_RESULT, EXECUTING, WAITING_TRAINING, NEED_INFORMATION, NEED_SELECTION, NEED_CONFIRMATION, NEED_CLARIFICATION, NOT_FOUND, CANCELLED, SUCCESS, FAILED, SYSTEM_ERROR, UNKNOWN]
    resultType:
      type: string
      description: 通用结果形态，供Agent统一解释，不依赖具体工具
      enum: [PAGE, ENTITY, TASK, PROGRESS, RESULT, COMMAND, MEMORY, OBJECT, ERROR]
    errorCode: {type: [string, "null"], description: 失败时的稳定错误码，成功时为null}
    errorType: {type: [string, "null"], description: 错误分类，成功时为null, enum: [BUSINESS, SYSTEM, null]}
    message: {type: string, description: 可展示给用户的结果或具体失败原因}
    retryable: {type: boolean, description: 是否允许调用方自动重试}
    data: {type: object, description: 业务结果；状态和失败查询包含机器可读的nextAction、allowedActions、reason和retryable, additionalProperties: true}

tools:
  - name: region_list
    title: 查询地区列表
    description: |
      业务能力：查询地区基础数据目录，返回地区记录，不返回客户、行业、预测或训练数据。
      适用用户目标：查询所有地区、有哪些省份、查看行政区/区域列表、按地区名称查找地区。
      筛选规则：不传keyword时返回全部地区；keyword仅用于按地区名称或编码筛选地区本身。
      禁止场景：用户要查询客户时不得调用，即使原话包含地区名称；例如“查询江苏所有客户”应使用customer_list，并把江苏作为客户筛选条件。
    inputSchema: &listInput
      type: object
      additionalProperties: false
      properties:
        keyword: {type: string, description: 可选编码或名称关键字}
        pageNo: {type: integer, description: 页码，默认1, minimum: 1}
        pageSize: {type: integer, description: 每页数量，默认20，最大100, minimum: 1, maximum: 100}
        fetchAll: {type: boolean, description: 是否一次返回全部符合条件的数据，最多5000条；明确要求全部时使用}
    outputSchema: *standardOutput
    annotations: &readOnly {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}

  - name: industry_list
    title: 查询行业列表
    description: |
      业务能力：查询行业基础数据目录，返回行业记录，不返回客户、地区、预测或训练数据。
      适用用户目标：查询所有行业、有哪些行业分类、查看行业列表、按行业名称查找行业。
      筛选规则：不传keyword时返回全部行业；keyword仅用于按行业名称或编码筛选行业本身。
      禁止场景：用户要查询客户或地区时不得调用；例如“查询城燃行业所有客户”应使用customer_list，并把城燃作为客户筛选条件。
    inputSchema: *listInput
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: customer_list
    title: 查询客户列表
    description: |
      业务能力：查询客户基础数据目录，返回客户记录及其所属地区、行业；不返回地区目录或行业目录。
      适用用户目标：查询所有客户、查询江苏所有客户、查询某行业的客户、按客户名称浏览客户。
      筛选规则：regionCode和industryCode只是客户过滤条件；不传筛选条件时返回全部客户。keyword仅用于客户名称或编码。
      禁止场景：用户目标是“所有地区/省份/行政区”时不得调用regionCode筛选后替代region_list；用户目标是行业目录时不得调用。
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        keyword: {type: string, description: 可选客户编码或名称关键字}
        regionCode: {type: string, description: 可选标准地区编码}
        industryCode: {type: string, description: 可选标准行业编码}
        pageNo: {type: integer, description: 页码，默认1, minimum: 1}
        pageSize: {type: integer, description: 每页数量，默认20，最大100, minimum: 1, maximum: 100}
        fetchAll: {type: boolean, description: 是否一次返回全部符合条件的客户，最多5000条；明确要求全部时使用}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: training_start
    title: 发起模型训练
    description: |
      业务能力：按用户指定的训练范围发起模型训练。
      训练范围由客户、地区、行业三个维度组合确定：可指定一个或多个客户、地区或行业；
      可只指定地区（例如“训练江苏省每个客户”）、只指定行业（例如“训练城燃行业所有客户”）、
      同时指定地区和行业（例如“训练江苏城燃行业所有客户”），或直接指定客户。
      范围计算规则：同一维度中的多个值按“或”匹配；不同维度同时存在时按“且”取交集。
      未指定客户、地区或行业时不得发起训练，必须向用户澄清训练对象范围。
      单个客户训练可直接发起；目标范围可能包含多个客户时，必须先展示训练范围并取得用户确认；
      强制重新训练也必须取得用户确认。
      数据范围：未指定时使用当前智能体默认训练数据范围；RECENT模式必须提供trainingPeriods；
      RANGE模式必须同时提供trainingStartDate和trainingEndDate。
      返回训练任务和训练批次信息。训练为异步执行，任务受理成功不代表训练已完成。
    inputSchema: &executionInput
      type: object
      required: [conversationNo]
      additionalProperties: false
      allOf: &executionRules
        - if:
            required: [trainMode]
            properties: {trainMode: {const: RECENT}}
          then:
            required: [trainingPeriods]
        - if:
            required: [trainMode]
            properties: {trainMode: {const: RANGE}}
          then:
            required: [trainingStartDate, trainingEndDate]
        - if:
            required: [bulk]
            properties: {bulk: {const: true}}
          then:
            required: [confirmed]
            properties: {confirmed: {const: true}}
            anyOf:
              - required: [customerCodes]
              - required: [regionCodes]
              - required: [regionCode]
              - required: [regionName]
              - required: [industryCodes]
              - required: [industryCode]
              - required: [industryName]
        - if:
            properties: {bulk: {const: false}}
          then:
            anyOf:
              - required: [customerCode]
              - required: [customerName]
      properties: &executionProperties
        conversationNo: {type: string, description: 会话编号}
        agentCode: {type: string, description: 智能体编码，默认short-term, enum: [short-term, monthly-sales, winter-supply]}
        customerCode: {type: string, description: 单客户标准编码}
        customerCodes:
          type: array
          minItems: 1
          maxItems: 5000
          uniqueItems: true
          items: {type: string}
          description: 批量实体校验后得到的标准客户编码集合
        customerName: {type: string, description: 客户名称，服务端解析成唯一编码}
        regionCode: {type: string, description: 批量范围的标准地区编码}
        regionCodes:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string}
          description: 批量实体校验后得到的标准地区编码集合，同类地区按或关系筛选
        regionName: {type: string, description: 批量范围地区名称，服务端解析成唯一编码}
        industryCode: {type: string, description: 批量范围的标准行业编码}
        industryCodes:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string}
          description: 批量实体校验后得到的标准行业编码集合，同类行业按或关系筛选
        industryName: {type: string, description: 批量范围行业名称或别名，服务端解析成唯一编码}
        bulk: {type: boolean, description: 是否批量执行，默认false}
        confirmed: {type: boolean, description: bulk=true时必须为true，表示用户已明确确认}
        trainMode: {type: string, description: 训练数据范围模式, enum: [ALL, RECENT, RANGE]}
        trainingPeriods: {type: integer, description: RECENT模式最近周期数，此模式下必填, minimum: 1, maximum: 10000}
        trainingStartDate: {type: string, format: date, description: 用户指定的训练开始日期；与结束日期同时提供时优先覆盖模型默认训练范围并按RANGE执行}
        trainingEndDate: {type: string, format: date, description: 用户指定的训练结束日期；与开始日期同时提供时优先覆盖模型默认训练范围并按RANGE执行}
        forceRetrain: {type: boolean, description: 是否忽略现有成功模型并强制重新训练}
        idempotencyKey: {type: string, description: 调用方生成的唯一幂等键，同一次网络重试必须复用}
    outputSchema: *standardOutput
    annotations: &mutating {readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: false}

  - name: training_result_query
    title: 查询训练结果
    description: 根据客户、地区、行业的组合条件，查询该训练范围最新一次训练结果。至少提供客户、地区或行业之一；同一维度多个条件按或匹配，不同维度同时存在时按且取交集。返回最新训练的状态、训练时间和结果指标。
    inputSchema:
      type: object
      additionalProperties: false
      anyOf: [{required: [customerCode]}, {required: [regionCode]}, {required: [industryCode]}]
      properties:
        customerCode: {type: string, description: 已校验的客户编码}
        regionCode: {type: string, description: 已校验的地区编码}
        industryCode: {type: string, description: 已校验的行业编码}
        agentCode: {type: string, description: 可选智能体编码, enum: [short-term, monthly-sales, winter-supply]}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: forecast_start
    title: 发起燃气预测
    description: 根据客户、地区、行业的组合范围，为匹配到的一个或多个客户发起指定智能体的燃气预测。至少提供客户、地区或行业之一；同时提供多个维度时按且取交集。服务端根据实际命中客户数自动判定单客户或批量预测：命中多个客户时先返回客户范围并要求确认，不能由模型自行指定批量模式，也不得从历史会话补充范围。short-term按天预测，默认30天；monthly-sales按月预测，默认12个月；winter-supply按旬预测，默认18旬。缺少可用模型时只返回原因并询问是否训练后预测，不得擅自训练。
    inputSchema:
      type: object
      required: [conversationNo, agentCode]
      additionalProperties: false
      anyOf:
        - required: [customerCode]
        - required: [customerCodes]
        - required: [regionCode]
        - required: [regionCodes]
        - required: [regionName]
        - required: [industryCode]
        - required: [industryCodes]
        - required: [industryName]
      properties:
        conversationNo: {type: string, description: 会话编号}
        agentCode: {type: string, description: 预测智能体编码；short-term为短期客户预测，monthly-sales为月度销量预测，winter-supply为冬季保供预测, enum: [short-term, monthly-sales, winter-supply]}
        customerCode: {type: string, description: 单个标准客户编码}
        customerCodes: {type: array, minItems: 1, maxItems: 5000, uniqueItems: true, items: {type: string}, description: 已确认的标准客户编码集合}
        customerName: {type: string, description: 单个客户名称，由服务端解析为唯一编码}
        regionCode: {type: string, description: 标准地区编码}
        regionCodes: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}, description: 标准地区编码集合}
        regionName: {type: string, description: 地区名称，由服务端解析为唯一编码}
        industryCode: {type: string, description: 标准行业编码}
        industryCodes: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}, description: 标准行业编码集合}
        industryName: {type: string, description: 行业名称，由服务端解析为唯一编码}
        forecastStartDate: {type: string, format: date, description: 用户指定的预测开始日期；未传时默认为客户最新销量日期的下一天}
        forecastEndDate: {type: string, format: date, description: 用户指定的预测结束日期；提供后按开始和结束日期计算周期，并优先于forecastHorizon}
        forecastHorizon: {type: integer, description: 预测周期；short-term单位为天，monthly-sales单位为月，winter-supply单位为旬。未传时分别默认30天、12个月、18旬, minimum: 1, maximum: 366}
        forecastFrequency: {type: string, description: 预测时间粒度；应与智能体匹配, enum: [DAILY, TENDAY, MONTHLY]}
        trainMode: {type: string, description: 仅在用户确认需要训练时使用的训练数据范围模式, enum: [ALL, RECENT, RANGE]}
        trainingPeriods: {type: integer, description: RECENT训练模式的最近周期数, minimum: 1, maximum: 10000}
        trainingStartDate: {type: string, format: date, description: RANGE训练模式开始日期}
        trainingEndDate: {type: string, format: date, description: RANGE训练模式结束日期}
        forceRetrain: {type: boolean, description: 是否明确要求重新训练后预测}
        trainingPreference: {type: string, description: 用户训练偏好；UNSPECIFIED不授权训练，AUTO仅在用户确认缺少模型后使用, enum: [FORCE_RETRAIN, USE_EXISTING_ONLY, UNSPECIFIED, AUTO]}
        autoTrain: {type: boolean, description: 是否已获得用户授权在缺少模型时训练，默认false}
        confirmed: {type: boolean, description: 用户已确认批量预测、自动训练或重新训练时为true}
        idempotencyKey: {type: string, description: 调用方生成的唯一幂等键，同一次网络重试必须复用}
    outputSchema: *standardOutput
    annotations: *mutating

  - name: forecast_result_query
    title: 查询预测进度与结果
    description: 根据客户、地区、行业的组合条件和智能体，查询该预测范围最新一次预测的当前状态、预测时间及预测值。至少提供客户、地区或行业之一；同时提供多个维度时按且取交集。
    inputSchema:
      type: object
      additionalProperties: false
      anyOf:
        - required: [customerCode]
        - required: [regionCode]
        - required: [industryCode]
      properties:
        customerCode: {type: string, description: 标准客户编码}
        regionCode: {type: string, description: 标准地区编码}
        industryCode: {type: string, description: 标准行业编码}
        agentCode: {type: string, description: 预测智能体编码, enum: [short-term, monthly-sales, winter-supply]}
        includePoints: {type: boolean, description: 是否返回逐期预测值，默认true}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: task_status_get
    title: 查询统一任务状态
    description: 查询训练、预测或训练后预测任务的总体进度、成功失败数量、当前阶段和恢复建议。恢复或重试之前必须先调用本工具。
    inputSchema:
      type: object
      required: [taskNo]
      additionalProperties: false
      properties:
        taskNo: {type: string, description: 统一任务编号}
        includeRecovery: {type: boolean, description: 是否分析恢复方式，默认true}
    outputSchema: *standardOutput
    annotations: *readOnly

  - name: task_steps_get
    title: 查询任务执行步骤
    description: 查询智能体可审计步骤；可同时返回训练批次的LOAD_DATA、DYNAMIC_FEATURE、MODEL_TRAIN等真实业务步骤。includeAttempts=true返回历史任务尝试。
    inputSchema:
      type: object
      required: [taskNo]
      additionalProperties: false
      properties:
        taskNo: {type: string, description: 统一任务编号}
        includeBusinessSteps: {type: boolean, description: 是否包含真实训练业务步骤，默认true}
        includeAttempts: {type: boolean, description: 是否包含历史任务尝试，默认false}
    outputSchema: *standardOutput
    annotations: *readOnly
